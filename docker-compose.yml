services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: naranja
      MYSQL_DATABASE: baseAerolinea
      MYSQL_USER: appAerolinea
      MYSQL_PASSWORD: naranja
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./migraciones:/docker-entrypoint-initdb.d

volumes:
  db_data: