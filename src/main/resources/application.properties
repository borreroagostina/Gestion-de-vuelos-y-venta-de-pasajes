server.port=8080
spring.config.import=optional:file:.env[.properties]

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3307/baseAerolinea?
  createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=appAerolinea
spring.datasource.password=naranja
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.servlet.session.timeout=15m


# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Thymeleaf
spring.thymeleaf.cache=false

# Logging
logging.level.root=INFO
logging.level.com.aerolinea=DEBUG
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# Registration
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.email.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@aerolinea.local}}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Reserva temporal de asientos
app.reserva.expiracion-minutos=10
app.reserva.job-rate-ms=60000

# Stripe Checkout uses test-mode credentials; webhook events can be forwarded with Stripe CLI
app.payment.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.payment.stripe.api-base-url=https://api.stripe.com
app.payment.currency=ARS
app.payment.refund-retry-ms=60000
app.payment.order-expiry-poll-ms=30000
app.email.outbox-poll-ms=30000
