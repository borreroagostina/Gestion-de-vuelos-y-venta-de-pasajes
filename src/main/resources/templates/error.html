<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Error</title>
    <style>
      body {
        font-family: monospace;
        background: #f8f9fa;
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #d32f2f;
      }
      .error-details {
        background: #ffebee;
        padding: 15px;
        border-left: 4px solid #d32f2f;
        border-radius: 4px;
        margin: 20px 0;
      }
      .stack-trace {
        background: #f5f5f5;
        padding: 15px;
        border-radius: 4px;
        overflow-x: auto;
        font-size: 12px;
        line-height: 1.4;
      }
      a {
        color: #2d6cdf;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Error</h1>
      <div class="error-details">
        <strong>Estado:</strong>
        <span th:text="${status}">500</span>
        <br />
        <strong>Error:</strong>
        <span th:text="${error}">Internal Server Error</span>
        <br />
        <strong>Mensaje:</strong>
        <span th:text="${message}">Unexpected error</span>
      </div>

      <div th:if="${exception}">
        <h3>Excepción</h3>
        <div class="stack-trace">
          <div th:text="${exception.class.name}"></div>
          <div th:text="${exception.message}"></div>
          <hr />
          <div th:each="stackTraceElement : ${trace}">
            <div th:text="' at ' + ${stackTraceElement.className} + '.' + ${stackTraceElement.methodName} + '(line ' + ${stackTraceElement.lineNumber} + ')'"></div>
          </div>
        </div>
      </div>

      <div style="margin-top: 20px;">
        <a href="/">Volver al inicio</a>
      </div>
    </div>
  </body>
</html>
