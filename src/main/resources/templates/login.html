<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Iniciar sesión</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
      }
      .login-container {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
      }
      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 2rem;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
        color: #555;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 1rem;
      }
      input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
      }
      button {
        width: 100%;
        padding: 0.75rem;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        margin-top: 1rem;
      }
      button:hover {
        background: #5568d3;
      }
      .error {
        background: #ffebee;
        color: #b71c1c;
        padding: 0.8rem 1rem;
        border-radius: 8px;
        margin-bottom: 1rem;
      }
      .info {
        background: #e3f2fd;
        color: #1565c0;
        padding: 0.8rem 1rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        font-size: 0.9rem;
      }
      a {
        color: #667eea;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .back-link {
        text-align: center;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h1>Iniciar sesión</h1>

      <div th:if="${param.error}" class="error">
        Usuario o contraseña incorrectos
      </div>

      <div class="info">
        <strong>Credenciales de prueba:</strong><br/>
        Admin: admin / admin123<br/>
        Pasajero: pasajero / pass123<br/>
        Empleado: empleado / emp123
      </div>

      <form method="post" th:action="@{/login}">
        <div class="form-group">
          <label for="username">Usuario:</label>
          <input type="text" id="username" name="username" required autofocus />
        </div>

        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" required />
        </div>

        <button type="submit">Iniciar sesión</button>
      </form>

      <div class="back-link">
        <a href="/">Volver al inicio</a>
      </div>
    </div>
  </body>
</html>
