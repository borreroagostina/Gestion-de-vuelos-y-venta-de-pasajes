<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${title}">Panel del pasajero</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; background: #f4f7fb; }
      .container { max-width: 900px; margin: 0 auto; }
      .card { background: white; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
      .nav { display: flex; gap: 1rem; margin-bottom: 1.5rem; align-items: center; flex-wrap: wrap; }
      .btn { display: inline-block; padding: 0.7rem 1rem; background: #0d6efd; color: white; text-decoration: none; border-radius: 8px; }
      .btn.secondary { background: #6c757d; }
      ul { line-height: 1.8; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="nav">
        <a class="btn secondary" th:href="@{/}">Inicio público</a>
        <form method="post" th:action="@{/logout}" style="display: inline;">
          <button type="submit" class="btn secondary" style="border: none; cursor: pointer;">
            Cerrar sesión
          </button>
        </form>
      </div>

      <div class="card">
        <h1 th:text="${title}">Panel del pasajero</h1>
        <p th:text="${subtitle}">Busqueda, compra y gestion de viajes</p>
        <div style="margin-top: 1rem;">
          <a class="btn" th:href="@{${compraPath}}">Buscar vuelos y comprar pasajes</a>
        </div>
      </div>

      <div class="card">
        <h2>Menú del rol pasajero</h2>
        <ul>
          <li th:each="permiso : ${permisos}">
            <strong th:text="${permiso.titulo}">Comprar pasajes</strong>:
            <span th:text="${permiso.descripcion}">Descripción</span>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
