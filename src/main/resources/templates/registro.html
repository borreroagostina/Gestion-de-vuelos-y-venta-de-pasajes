<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Registro de cuenta</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
      }
      .register-container {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 520px;
      }
      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 1.5rem;
      }
      .form-group {
        margin-bottom: 0.8rem;
      }
      label {
        display: block;
        margin-bottom: 0.35rem;
        color: #555;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 0.7rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 1rem;
      }
      input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
      }
      .field-error {
        color: #b71c1c;
        font-size: 0.85rem;
        margin-top: 0.2rem;
      }
      .error {
        background: #ffebee;
        color: #b71c1c;
        padding: 0.8rem 1rem;
        border-radius: 8px;
        margin-bottom: 1rem;
      }
      .note {
        background: #e8f5e9;
        color: #2e7d32;
        padding: 0.8rem 1rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        font-size: 0.9rem;
      }
      button {
        width: 100%;
        padding: 0.75rem;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        margin-top: 0.8rem;
      }
      button:hover {
        background: #5568d3;
      }
      .links {
        text-align: center;
        margin-top: 1rem;
      }
      a {
        color: #667eea;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="register-container">
      <h1>Crear cuenta de pasajero</h1>

      <div th:if="${error}" class="error" th:text="${error}"></div>
      <div class="note">
        La contraseña debe tener al menos 8 caracteres, una letra y un número.
      </div>

      <form method="post" th:action="@{/registro}" th:object="${registroUsuarioForm}">
        <div class="form-group">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" th:field="*{nombre}" required />
          <div class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>

        <div class="form-group">
          <label for="apellido">Apellido:</label>
          <input type="text" id="apellido" th:field="*{apellido}" required />
          <div class="field-error" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
        </div>

        <div class="form-group">
          <label for="documento">Documento:</label>
          <input type="text" id="documento" th:field="*{documento}" required />
          <div class="field-error" th:if="${#fields.hasErrors('documento')}" th:errors="*{documento}"></div>
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" th:field="*{email}" required />
          <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono:</label>
          <input type="text" id="telefono" th:field="*{telefono}" required />
          <div class="field-error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" th:field="*{password}" required />
          <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <button type="submit">Registrarme</button>
      </form>

      <div class="links">
        <a href="/login">Ya tengo cuenta</a> | <a href="/">Volver al inicio</a>
      </div>
    </div>
  </body>
</html>
